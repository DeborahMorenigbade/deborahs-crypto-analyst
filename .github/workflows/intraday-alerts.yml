name: Deborah Intraday Alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deborah-intraday-alerts
  cancel-in-progress: false
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore alert deduplication state
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: intraday-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            intraday-state-
      - name: Check 15-minute opportunities
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python intraday_alerts.py
      - name: Save alert deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: intraday-state-${{ github.run_id }}-${{ github.run_attempt }}
